name: Canli Piyasa Guncelle

on:
  schedule:
    - cron: '*/15 * * * *'  # Her 15 dakikada bir çalışır
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v3

    - name: Python Kurulumu
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Kütüphaneleri Yükle
      run: pip install requests

    - name: Piyasa Botunu Çalıştır
      run: python bot.py

    - name: Verileri GitHub'a Kaydet
      run: |
        git config --global user.name "Finans Botu"
        git config --global user.email "bot@inadinatv-finans.com"
        git add index.html
        git commit -m "📈 Piyasalar güncellendi" || exit 0
        git push
